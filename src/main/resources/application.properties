# HTTP port: 8080 unless the PORT environment variable is set
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:iecms
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT signing key (at least 32 characters). Set APP_JWT_SECRET in every real environment.
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
# Creates admin / registrar / judge / viewer on an empty database. Set APP_DEMO_USERS_ENABLED=false in production.
app.demo-users.enabled=${APP_DEMO_USERS_ENABLED:true}

# Every log line carries the request id from CorrelationIdFilter
logging.pattern.level=%5p [%X{requestId:-}]

# Health endpoint for load balancers and Kubernetes probes: /actuator/health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
